<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Mis Tareas</title>
    <meta name="description" content="Gestiona tus tareas de forma eficiente con TaskFlow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/app.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="app-logo">✓</div>
                <h1 class="app-title">TaskFlow</h1>
            </div>
            <div class="header-center">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar tareas...">
                </div>
            </div>
            <div class="user-info">
                <button class="btn-notifications" id="notificationsBtn" title="Notificaciones">
                    🔔
                </button>
                <button class="btn-notifications" id="exportBtn" title="Exportar Datos" style="background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); color: #4ade80;">
                    📄
                </button>
                <a href="analytics.html" class="btn-profile" title="Analytics" style="background: rgba(79, 172, 254, 0.1); border-color: rgba(79, 172, 254, 0.3); color: #4facfe;">
                    📊
                </a>
                <a href="profile.html" class="btn-profile" title="Mi Perfil">
                    👤
                </a>
                <span class="user-email" id="userEmail">Cargando...</span>
                <button class="btn-logout" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </header>

        <!-- Stats -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">Total de Tareas</div>
                <div class="stat-value" id="totalTasks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Activas</div>
                <div class="stat-value" id="activeTasks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completadas</div>
                <div class="stat-value" id="completedTasks">0</div>
            </div>
        </section>

        <!-- Todo Input -->
        <section class="todo-input-container">
            <div class="todo-input-wrapper">
                <input type="text" id="todoInput" class="todo-input" placeholder="¿Qué necesitas hacer hoy?"
                    maxlength="200">
                <select id="prioritySelect" class="priority-select">
                    <option value="low">🟢 Baja</option>
                    <option value="medium" selected>🟡 Media</option>
                    <option value="high">🔴 Alta</option>
                </select>
                <select id="categorySelect" class="category-select">
                    <option value="">Sin categoría</option>
                    <!-- Categories will be loaded dynamically -->
                </select>
                <button class="btn-add" id="addBtn">Agregar</button>
            </div>
            <div class="char-counter">
                <span id="charCount">0</span>/200 caracteres
            </div>
            
            <!-- Notes and Attachments Toggle -->
            <div class="notes-toggle-container">
                <button class="btn-toggle-notes" id="toggleNotesBtn">
                    📝 Agregar notas o archivos adjuntos
                </button>
            </div>
            
            <!-- Notes Editor (Hidden by default) -->
            <div class="notes-editor" id="notesEditor" style="display: none;">
                <div class="notes-section">
                    <label for="notesInput">📝 Notas adicionales</label>
                    <textarea id="notesInput" class="notes-textarea" placeholder="Agrega detalles, instrucciones o cualquier información adicional..." rows="4" maxlength="2000"></textarea>
                    <div class="char-counter-notes">
                        <span id="notesCharCount">0</span>/2000 caracteres
                    </div>
                </div>
                
                <div class="attachments-section">
                    <label>📎 Archivos adjuntos</label>
                    <input type="file" id="attachmentInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.xlsx,.csv" style="display: none;">
                    <button class="btn-upload-attachment" id="uploadAttachmentBtn">
                        Seleccionar archivos
                    </button>
                    <div class="attachments-preview" id="attachmentsPreview">
                        <!-- Attachments will be shown here -->
                    </div>
                    <div class="attachment-info">
                        Máximo 5 archivos, 10MB por archivo
                    </div>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="filters">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Activas</button>
                <button class="filter-btn" data-filter="completed">Completadas</button>
            </div>
            <div class="filter-group">
                <button class="filter-btn priority-filter" data-priority="high">🔴 Alta</button>
                <button class="filter-btn priority-filter" data-priority="medium">🟡 Media</button>
                <button class="filter-btn priority-filter" data-priority="low">🟢 Baja</button>
            </div>
            <div class="filter-group" id="categoryFilters">
                <!-- Category filters will be loaded dynamically -->
                <button class="btn-categories" onclick="categoriesManager.openModal()">📋 Categorías</button>
            </div>
        </section>

        <!-- Todo List -->
        <section class="todo-list-container">
            <div id="todoList" class="todo-list">
                <div class="loading">
                    <div class="spinner-large"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/dragdrop.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/sharing.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
